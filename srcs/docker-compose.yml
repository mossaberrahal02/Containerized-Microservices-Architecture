services:
  mariadb:
    build:
      context: ./requirements/mariadb/
    image: mariadb:v0
    container_name: mariadb
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - /home/merrahal/data/database:/var/lib/mysql
    networks:
      inception:
    init: true

  redis:
    build:
      context: ./requirements/bonus/redis/
    image: redis:v0
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    networks:
      inception:
    init: true

  wordpress:
    build:
      context: ./requirements/wordpress/
    image: wordpress:v0
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    environment:
      URL: ${URL}
      TITLE: ${TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_ROLE: ${WP_ROLE}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
      DB_USER: ${DB_USER}
      DB_HOST: ${DB_HOST}
      DB_HOST_PORT: ${DB_HOST_PORT}
      DB_NAME: ${DB_NAME}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - wp_admin_password
      - wp_user_password
      - db_password
      - redis_password
    networks:
      inception:
    volumes:
      - /home/merrahal/data/web:/var/www/html
    init: true
  
  nginx:
    build:
      context: ./requirements/nginx/
      args:
        COUNTRY: ${COUNTRY}
        STATE: ${STATE}
        LOCALITY: ${LOCALITY}
        ORGANIZATION: ${ORGANIZATION}
        UNIT: ${UNIT}
        COMMON_NAME: ${COMMON_NAME}
    image: nginx:v0
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - mariadb
      - wordpress
    ports:
      - "443:443"
    volumes:
      - /home/merrahal/data/web:/var/www/html
    networks:
      inception:
    init: true

  ftp:
    build:
      context: ./requirements/bonus/ftp/
    image: ftp:v0
    container_name: ftp
    restart: unless-stopped
    ports:
      - "30000-30009:30000-30009"
      - "21:21"
    environment:
      FTP_USER: ${FTP_USER}
      FTP_USER_PASSWORD_FILE: /run/secrets/ftp_user_password
    secrets:
      - ftp_user_password
    volumes:
      - /home/merrahal/data/web:/home/ftpuser/wordpress
    networks:
      inception:
    init: true

  adminer:
    build:
      context:
        ./requirements/bonus/adminer
    image: adminer:v0
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      inception:
    init: true

  static:
    build:
      context: ./requirements/bonus/static
    image: static:v0
    container_name: static
    restart: unless-stopped
    ports:
      - "7070:7070"
    init: true

  cadvisor:
    build:
      context: ./requirements/bonus/cadvisor
    image: cadvisor:v0
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "9090:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/var/lib/containerd/:/var/lib/containerd:ro"
      - "/dev/disk/:/dev/disk:ro"
      - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
    init: true

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt

networks:
  inception:
